name: Settings visual proof

on:
  push:
    branches:
      - design/hotel-settings
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Capture Settings calibration viewports
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/partout-vite.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT

          ready=0
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/hotel/settings > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/partout-vite.log
            exit 1
          fi

          mkdir -p visual-proof
          for route in settings settings/profile settings/gallery settings/account; do
            slug=$(echo "$route" | tr '/' '-')
            npx --yes playwright@1.55.0 screenshot --viewport-size="1440,720" "http://127.0.0.1:3000/hotel/$route" "visual-proof/${slug}-1440x720.png"
            npx --yes playwright@1.55.0 screenshot --viewport-size="1600,800" "http://127.0.0.1:3000/hotel/$route" "visual-proof/${slug}-1600x800.png"
          done

      - name: Upload visual proof
        uses: actions/upload-artifact@v4
        with:
          name: settings-visual-proof
          path: visual-proof/*.png
          if-no-files-found: error
          retention-days: 7
