name: Stays visual proof

on:
  push:
    branches:
      - design/hotel-stays
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Start app
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/partout-vite.log 2>&1 &
          echo $! > /tmp/partout-vite.pid
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/hotel/stays > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/partout-vite.log
          exit 1

      - name: Capture Stays calibration viewports
        run: |
          mkdir -p visual-proof
          npx --yes playwright@1.55.0 screenshot --viewport-size="1440,720" http://127.0.0.1:3000/hotel/stays visual-proof/stays-1440x720.png
          npx --yes playwright@1.55.0 screenshot --viewport-size="1600,800" http://127.0.0.1:3000/hotel/stays visual-proof/stays-1600x800.png

      - name: Upload visual proof
        uses: actions/upload-artifact@v4
        with:
          name: stays-visual-proof
          path: visual-proof/*.png
          if-no-files-found: error
          retention-days: 7
